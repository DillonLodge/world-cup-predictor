<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merronbrook World Cup Predictor</title>
  <style>
    :root {
      --brand: #8d1746;
      --brand-dark: #5b0f2d;
      --brand-soft: #b54b73;
      --gold: #f1c75b;
      --silver: #d7dde5;
      --bronze: #be7c49;
      --ink: #f7f7fb;
      --muted: #ddd8e1;
      --line: rgba(255,255,255,0.14);
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.10), transparent 24%),
        radial-gradient(circle at bottom right, rgba(241,199,91,0.13), transparent 26%),
        linear-gradient(180deg, #6f1238 0%, var(--brand) 38%, var(--brand-dark) 100%);
      overflow-x: hidden;
      position: relative;
    }

    .bg-layer, .flags-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-layer {
      opacity: 0.22;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,0.22), transparent 18%),
        radial-gradient(circle at 50% 86%, rgba(255,255,255,0.10), transparent 20%),
        linear-gradient(90deg, transparent 49.75%, rgba(255,255,255,0.18) 49.75%, rgba(255,255,255,0.18) 50.25%, transparent 50.25%),
        radial-gradient(circle at 50% 50%, transparent 0 84px, rgba(255,255,255,0.16) 84px 86px, transparent 86px);
      background-repeat: no-repeat;
    }

    .flags-layer {
      opacity: 0.14;
      overflow: hidden;
    }

    .flag {
      position: absolute;
      font-size: clamp(22px, 4vw, 40px);
      user-select: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.25));
      transform: rotate(var(--rot)) scale(var(--scale));
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 34px;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
      padding: 18px 16px 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      border: 1px solid var(--line);
      border-radius: 26px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px var(--shadow);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
    }

    .logo-wrap img {
      width: min(100%, 520px);
      height: auto;
      display: block;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      background: rgba(255,255,255,0.10);
    }

    .hero-kicker {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 46px);
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .updated {
      margin-top: 14px;
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      font-size: 13px;
    }

    .podium {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .podium-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.05));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 45px var(--shadow);
    }

    .medal {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 22px;
      color: #1d1420;
      flex: 0 0 auto;
      box-shadow: inset 0 -6px 12px rgba(0,0,0,0.12);
    }

    .gold { background: var(--gold); }
    .silver { background: var(--silver); }
    .bronze { background: var(--bronze); color: #fff; }

    .podium-name {
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .podium-points {
      margin-top: 4px;
      color: var(--muted);
    }

    .board {
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 60px var(--shadow);
    }

    .row {
      display: grid;
      grid-template-columns: 58px 1fr 90px;
      gap: 10px;
      align-items: center;
      padding: 14px 15px;
      border-bottom: 1px solid var(--line);
    }

    .row:nth-child(even):not(.header) {
      background: rgba(255,255,255,0.03);
    }

    .row:last-child { border-bottom: none; }

    .row.header {
      background: linear-gradient(90deg, rgba(255,255,255,0.14), rgba(255,255,255,0.07));
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .rank {
      font-weight: 900;
      color: #fff;
    }

    .name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .points {
      text-align: right;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .refresh {
      margin: 18px auto 0;
      display: block;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: linear-gradient(90deg, #ffffff, #f4d687);
      color: var(--brand-dark);
      font-weight: 900;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.24);
    }

    .message {
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-top: 20px;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }

    @media (min-width: 720px) {
      .podium { grid-template-columns: repeat(3, 1fr); }
      .podium-card { flex-direction: column; text-align: center; min-height: 165px; justify-content: center; }
      .podium-card.first { transform: translateY(-8px); }
    }
  </style>
</head>

      }

      if (value.length || row.length) {
        row.push(value);
        if (row.some(cell => cell.trim() !== '')) rows.push(row);
      }

      return rows;
    }

    function normaliseLeaderboard(rows) {
      if (!rows.length) return [];
      const header = rows[0].map(h => h.trim().toLowerCase());
      const positionIndex = header.indexOf('position');
      const nameIndex = header.indexOf('name');
      const pointsIndex = header.indexOf('points');

      return rows.slice(1)
        .map((r, i) => ({
          position: positionIndex >= 0 ? r[positionIndex] : String(i + 1),
          name: nameIndex >= 0 ? r[nameIndex] : r[0],
          points: pointsIndex >= 0 ? r[pointsIndex] : r[1]
        }))
        .filter(p => p.name && p.name.trim() !== '' && p.name.trim() !== '0')
        .map((p, i) => ({
          position: p.position || String(i + 1),
          name: p.name.trim(),
          points: p.points ? p.points.trim() : '0'
        }));
    }

    function renderPodium(players) {
      const podium = document.getElementById('podium');
      podium.innerHTML = '';
      const classes = ['gold', 'silver', 'bronze'];
      const labels = ['1', '2', '3'];

      players.slice(0, 3).forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'podium-card' + (i === 0 ? ' first' : '');
        card.innerHTML = `
          <div class="medal ${classes[i]}">${labels[i]}</div>
          <div>
            <div class="podium-name">${escapeHtml(p.name)}</div>
            <div class="podium-points">${escapeHtml(p.points)} pts</div>
          </div>
        `;
        podium.appendChild(card);
      });
    }

    function renderTable(players) {
      const board = document.getElementById('leaderboard');
      board.innerHTML = `
        <div class="row header">
          <div>Pos</div>
          <div>Name</div>
          <div>Points</div>
        </div>
      `;

      players.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div class="rank">${escapeHtml(p.position || String(i + 1))}</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="points">${escapeHtml(p.points)}</div>
        `;
        board.appendChild(row);
      });
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadLeaderboard() {
      const message = document.getElementById('message');
      const updated = document.getElementById('updated');
      message.style.display = 'none';
      updated.textContent = 'Refreshing...';

      try {
        const response = await fetch(CSV_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load leaderboard.csv');

        const text = await response.text();
        const rows = parseCSV(text);
        const players = normaliseLeaderboard(rows);

        if (!players.length) throw new Error('leaderboard.csv loaded, but no players were found.');

        renderPodium(players);
        renderTable(players);

        const now = new Date();
        updated.textContent = 'Last refreshed: ' + now.toLocaleString();
      } catch (error) {
        updated.textContent = 'Could not refresh';
        message.style.display = 'block';
        message.textContent = error.message;
      }
    }

    buildFlagBackground();
    loadLeaderboard();
    setInterval(loadLeaderboard, 60000);
  </script>
</body>
</html>
